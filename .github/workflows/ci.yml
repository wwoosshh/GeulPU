# GeulPU 빠른 점검 — GPU · 모델 파일 없이 커밋마다(시험/빠른점검.py). 글(geul) 컴파일러는 CPU 프로그램이라 커널 소스 → PTX 까지는
# GPU 없이 만들 수 있다: 글 컴파일러 · PTX 뒷단을 글 저장소의 고정 커밋(시험/글저장소커밋.txt)에서 빌드하고, 생성기 · 호스트 프로그램을
# 빌드하고, 모듈을 처음부터 만들어 시험/모듈해시.txt 와 바이트까지 견준다. GPU 의 비트 대조 · 속도는 단계마다의 공식 실행(공식실행/)이 한다.
name: 빠른 점검
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: GeulPU 받기
        uses: actions/checkout@v5
        with:
          path: GeulPU
      - name: 글 저장소의 고정 커밋 읽기
        id: geul
        run: echo "sha=$(tr -d '\r\n ' < GeulPU/시험/글저장소커밋.txt)" >> "$GITHUB_OUTPUT"
      - name: 글 저장소 받기(research/gpu 의 고정 커밋)
        uses: actions/checkout@v5
        with:
          repository: wwoosshh/geul-lang
          ref: ${{ steps.geul.outputs.sha }}
          path: geul-lang-v2
      - name: 파이썬
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 파이썬 꾸러미
        run: python -m pip install -r GeulPU/requirements.txt
      - name: 글 컴파일러 · PTX 뒷단 캐시
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            geul-lang-v2/build/self_컴파일러.exe
            geul-lang-v2/build/자체PTX.exe
          key: geul-tools-${{ steps.geul.outputs.sha }}
      - name: 글 컴파일러 · PTX 뒷단 빌드(파이썬 참조 구현 → 글로 쓴 컴파일러 → PTX 뒷단)
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: geul-lang-v2
        env:
          PYTHONUTF8: "1"
        run: |
          mkdir -p build
          GEUL_ROOT=. python ref/geulc.py self/컴파일러.gl -o build/self_컴파일러.exe
          GEUL_ROOT=. build/self_컴파일러.exe research/gpu/자체PTX/PTX.gl -o build/자체PTX.exe
          sha256sum build/self_컴파일러.exe build/자체PTX.exe
      - name: 빠른 점검
        working-directory: GeulPU
        env:
          PYTHONUTF8: "1"
        run: python -X utf8 시험/빠른점검.py --글 ../geul-lang-v2 --출력 점검결과
      - name: 점검 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-result
          path: GeulPU/점검결과/*.txt
          if-no-files-found: ignore
